name: E2E Tests - Jira

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Jira fixture preparation mode
        type: choice
        options: [auto, cold, restore]
        default: auto

permissions:
  contents: read

jobs:
  e2e-jira:
    name: Packaged action against Jira Data Center
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build packaged action
        run: yarn build
      - name: Reject stale committed action bundle
        run: git diff --exit-code -- dist
      - name: Prepare disposable Jira
        id: jira
        uses: bitflight-devops/github-action-jira-transition-manager/e2e/jira@4e95d80b6115ef60f14bc7c351a23c6ae5f06da5
        with:
          mode: ${{ inputs.mode || 'auto' }}
      - name: Exercise packaged action and verify Jira effects
        run: yarn e2e:test
      - name: Arrange native action smoke test
        id: fixture
        run: node e2e/in-place.mjs arrange
      - name: Execute the action through its GitHub manifest
        id: action
        uses: ./
        with:
          issues: ${{ steps.fixture.outputs.issue_key }}
          jira_base_url: ${{ steps.jira.outputs.base-url }}
          jira_user_email: admin
          jira_api_token: admin
          fail_on_error: 'true'
          token: ${{ github.token }}
          fix_versions: ${{ steps.fixture.outputs.target_name }}
      - name: Assert the native action added the existing version and preserved the prior version
        env:
          ISSUE_KEY: ${{ steps.fixture.outputs.issue_key }}
          TARGET_ID: ${{ steps.fixture.outputs.target_id }}
          PRESERVED_ID: ${{ steps.fixture.outputs.preserved_id }}
          TARGET_NAME: ${{ steps.fixture.outputs.target_name }}
        run: node e2e/in-place.mjs verify
      - name: Collect diagnostics
        if: failure() && env.JIRA_E2E_HARNESS != ''
        run: node "$JIRA_E2E_HARNESS" logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: jira-action-diagnostics
          path: |
            ${{ runner.temp }}/jira-e2e/artifacts
            e2e/artifacts
          retention-days: 7
      - name: Remove disposable environment
        if: always() && env.JIRA_E2E_HARNESS != ''
        run: node "$JIRA_E2E_HARNESS" down
